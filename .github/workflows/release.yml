name: Release

# Publication MANUELLE uniquement : la signature de release est faite en local,
# avec le keystore de l'auteur, qui ne doit pas être stocké dans le dépôt.
# Pour l'utiliser quand même : ajouter les secrets KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, puis voir le README.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (doit déjà exister, ex. v1.7)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Déterminer le tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            echo "::error::Aucun tag fourni."
            exit 1
          fi
          echo "TAG_NAME=$INPUT_TAG" >> "$GITHUB_ENV"
          echo "Tag ciblé : $INPUT_TAG"

      - name: Vérifier que le tag correspond à versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$TAG_NAME" ]; then
            echo "::error::Le tag $TAG_NAME ne correspond pas à versionName=$VERSION"
            exit 1
          fi
          echo "Tag et version cohérents : v$VERSION"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Préparer le SDK Android
        run: |
          # ubuntu-latest fournit déjà le SDK et ANDROID_HOME.
          # On n'utilise pas android-actions/setup-android : il installe le
          # paquet « tools », retiré du dépôt SDK par Google, et échoue.
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager introuvable dans $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" \
            "build-tools;34.0.0" "build-tools;36.0.0"
          echo "SDK Android prêt : $ANDROID_HOME"

      - name: Préparer la signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$GITHUB_WORKSPACE/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
              > keystore.properties
            echo "Signature configurée."
          else
            echo "::warning::Secrets de signature absents : l'APK publié sera NON SIGNÉ."
          fi

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Construire l'APK de release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Nommer l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PocketMirror-${TAG_NAME}.apk"
          ls -lh dist

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: PocketMirror ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: dist/PocketMirror-*.apk
          fail_on_unmatched_files: true
